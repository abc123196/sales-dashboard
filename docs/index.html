<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 年 9 月銷售儀表板</title>
<meta name="description" content="教學用模擬銷售資料：每日淨銷售額、商品、分類與通路比較。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF1F4;
  --sheet: #FFFFFF;
  --ink: #14202B;
  --muted: #566879;
  --line: #D5DDE4;
  --accent: #0B5C8E;
  --accent-soft: rgba(11, 92, 142, .12);
  --good: #1B7F5C;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E161E;
    --sheet: #16212C;
    --ink: #E6EDF3;
    --muted: #94A5B5;
    --line: #2A3947;
    --accent: #5DB4E8;
    --accent-soft: rgba(93, 180, 232, .16);
    --good: #4CC596;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.65 var(--sans);
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1160px; margin: 0 auto; padding: clamp(16px, 3.2vw, 40px); }
h1, h2 { font-family: var(--serif); margin: 0; line-height: 1.3; }
h1 { font-size: clamp(1.5rem, 3.4vw, 2.1rem); }
h2 { font-size: 1.12rem; }
p { margin: 0; }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* 頁首 */
.top { display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
.top .sub { color: var(--muted); font-size: .92rem; margin-top: 6px; }
.status { font-size: .85rem; color: var(--muted); text-align: right; line-height: 1.7; }
.status strong { color: var(--ink); font-weight: 700; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: var(--good); }
.dot.err { background: #C2543F; }

/* 關鍵數字：主指標 + 四個輔助指標 */
.kpis { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px 48px; margin-bottom: 28px; align-items: stretch; }
.kpi-main { border-left: 4px solid var(--accent); padding: 4px 0 4px 20px; display: flex; flex-direction: column; justify-content: center; }
.k-label { color: var(--muted); font-size: .92rem; }
.k-big { font: 700 clamp(2.3rem, 6.2vw, 3.8rem)/1.1 var(--serif); letter-spacing: -.01em; margin: 4px 0 6px; overflow-wrap: anywhere; }
.delta { font-size: .88rem; color: var(--muted); }
.delta.up { color: var(--good); font-weight: 500; }
.kpi-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; margin: 0; }
.kpi-list > div { border-top: 1px solid var(--line); padding: 12px 0 14px; min-width: 0; }
.kpi-list dt { color: var(--muted); font-size: .88rem; }
.kpi-list dd { margin: 0; }
.kpi-list .k-num { font: 700 1.55rem/1.3 var(--serif); display: block; }

/* 圖表區 */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 20px; min-width: 0; }
.s12 { grid-column: span 12; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; }
.panel header { margin-bottom: 14px; }
.insight { color: var(--muted); font-size: .9rem; margin-top: 4px; max-width: 70ch; }
.box { position: relative; height: 320px; }
.box.tall { height: 380px; }
.box.hero { height: 340px; }
.box.pie { height: 230px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 12px; padding: 0; list-style: none; font-size: .85rem; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.share { list-style: none; margin: 14px 0 0; padding: 0; font-size: .92rem; }
.share li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.share .pct { min-width: 3.6em; text-align: right; font-weight: 700; }

/* 頁尾 */
.foot { margin-top: 28px; font-size: .88rem; color: var(--muted); }
details { border-top: 1px solid var(--line); padding: 12px 0; }
summary { cursor: pointer; color: var(--ink); font-weight: 500; }
.table-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 420px; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; }
.ok { color: var(--good); font-weight: 700; }
.bad { color: #C2543F; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 6px; font-size: .9rem; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 5; }
.toast.show { opacity: 1; }

@media (max-width: 960px) {
  .kpis { grid-template-columns: 1fr; }
  .s7, .s6, .s5 { grid-column: span 12; }
  .status { text-align: left; }
}
@media (max-width: 560px) {
  .panel { padding: 14px; }
  .box, .box.hero { height: 280px; }
  .box.tall { height: 360px; }
  .kpi-main { padding-left: 14px; }
  .kpi-list .k-num { font-size: 1.3rem; }
  .share li { grid-template-columns: 12px 1fr auto; }
  .share li .amt { grid-column: 2 / 4; color: var(--muted); font-size: .85rem; order: 3; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>2026 年 9 月銷售儀表板</h1>
      <p class="sub">教學用模擬資料。金額為新臺幣，未另計稅、折扣或運費。</p>
    </div>
    <div class="status" aria-live="polite">
      <p><strong id="stSnapshot">載入中</strong></p>
      <p id="stLoaded"></p>
      <p id="stBuilt"></p>
      <p><span class="dot" id="stDot"></span><span id="stPoll"></span></p>
    </div>
  </header>

  <section class="kpis" aria-label="關鍵數字">
    <div class="kpi-main">
      <span class="k-label">淨銷售額</span>
      <strong class="k-big" id="kNet">-</strong>
      <span class="delta" id="kNetD"></span>
    </div>
    <dl class="kpi-list">
      <div><dt>銷售紀錄</dt><dd><span class="k-num" id="kRec">-</span><span class="delta" id="kRecD"></span></dd></div>
      <div><dt>售出數量（含退貨）</dt><dd><span class="k-num" id="kQty">-</span><span class="delta" id="kQtyD"></span></dd></div>
      <div><dt>退貨數量</dt><dd><span class="k-num" id="kRet">-</span><span class="delta" id="kRetD"></span></dd></div>
      <div><dt>退貨率</dt><dd><span class="k-num" id="kRate">-</span><span class="delta" id="kRateD"></span></dd></div>
    </dl>
  </section>

  <main class="grid">
    <section class="panel s12">
      <header>
        <h2>每日淨銷售額</h2>
        <p class="insight" id="insDaily"></p>
      </header>
      <div class="box hero"><canvas id="cDaily" role="img" aria-label="每日淨銷售額折線圖"></canvas></div>
    </section>

    <section class="panel s7">
      <header>
        <h2>各商品淨銷售額</h2>
        <p class="insight" id="insProduct"></p>
      </header>
      <ul class="legend" id="catLegend" aria-label="分類顏色"></ul>
      <div class="box tall"><canvas id="cProduct" role="img" aria-label="各商品淨銷售額長條圖"></canvas></div>
    </section>

    <section class="panel s5">
      <header>
        <h2>各分類淨銷售額占比</h2>
        <p class="insight" id="insCategory"></p>
      </header>
      <div class="box pie"><canvas id="cCategory" role="img" aria-label="各分類淨銷售額占比圓餅圖"></canvas></div>
      <ul class="share" id="catShare"></ul>
    </section>

    <section class="panel s6">
      <header>
        <h2>通路比較</h2>
        <p class="insight" id="insChannel"></p>
      </header>
      <div class="box"><canvas id="cChannel" role="img" aria-label="各通路淨銷售額堆疊長條圖"></canvas></div>
    </section>

    <section class="panel s6">
      <header>
        <h2>售出數量與淨銷售額</h2>
        <p class="insight" id="insScatter"></p>
      </header>
      <div class="box"><canvas id="cScatter" role="img" aria-label="淨售出數量與淨銷售額散佈圖"></canvas></div>
    </section>
  </main>

  <footer class="foot">
    <details id="verify" hidden>
      <summary id="verifySummary">驗收數值</summary>
      <div class="table-wrap">
        <table>
          <thead><tr><th>項目</th><th class="num">預期</th><th class="num">資料庫</th><th>結果</th></tr></thead>
          <tbody id="verifyBody"></tbody>
        </table>
      </div>
    </details>
    <p>淨銷售額 = 單價 × (售出數量 − 退貨數量)。資料由 Python 從 MySQL 匯出為靜態檔案，重新執行 <code>pipeline.py build</code> 並推送後，這個頁面會自動載入新資料。</p>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

var POLL_MS = 30000;
var LABELS = { original: '原始資料', updated: '更新後資料' };
var PALETTE = ['#2F6DB5', '#1B9A86', '#E0982F', '#8A5FB0', '#C45B5B'];
var charts = {};
var catColor = {};
var lastCheck = null;
var pollState = 'idle';

var nf = new Intl.NumberFormat('zh-TW');
function $(id) { return document.getElementById(id); }
function money(v) { return 'NT$' + nf.format(Math.round(v)); }
function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + nf.format(Math.abs(Math.round(v))); }
function wan(v) { return Math.abs(v) >= 10000 ? (v / 10000).toLocaleString('zh-TW', { maximumFractionDigits: 1 }) + ' 萬' : nf.format(v); }
function pct(v, d) { return (v * 100).toFixed(d == null ? 1 : d) + '%'; }
function day(s) { return Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)); }
function stamp(s) { return s.replace('T', ' ').slice(0, 16); }
function label(l) { return LABELS[l] || l; }
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function sum(a, f) { return a.reduce(function (t, x) { return t + f(x); }, 0); }

/* ---------- 文字與數字 ---------- */
function renderStatus() {
  var s = DATA.meta.snapshot;
  $('stSnapshot').textContent = '目前資料：' + label(s.label);
  $('stLoaded').textContent = '匯入資料庫：' + stamp(s.loaded_at);
  $('stBuilt').textContent = '網頁產生：' + stamp(DATA.meta.generated_at);
  var dot = $('stDot'), t = $('stPoll');
  dot.className = 'dot';
  if (location.protocol === 'file:') { t.textContent = '本機檔案，未啟用自動更新'; return; }
  if (pollState === 'error') { dot.classList.add('err'); t.textContent = '暫時無法檢查更新，顯示目前版本'; return; }
  if (lastCheck) { dot.classList.add('live'); t.textContent = '每 30 秒檢查新資料，上次 ' + lastCheck.toLocaleTimeString('zh-TW', { hour12: false }); return; }
  t.textContent = '每 30 秒檢查新資料';
}

function setDelta(id, cur, prev, fmt, positiveIsGood) {
  var e = $(id), p = DATA.meta.previous;
  e.className = 'delta';
  if (!p) { e.textContent = ''; return; }
  var diff = cur - prev;
  e.textContent = diff === 0 ? '與' + label(p.label) + '相同' : '較' + label(p.label) + ' ' + fmt(diff);
  if (positiveIsGood && diff > 0) e.classList.add('up');
}

function renderKpis() {
  var s = DATA.meta.snapshot, p = DATA.meta.previous;
  $('kNet').textContent = money(s.net_revenue);
  $('kRec').textContent = nf.format(s.records);
  $('kQty').textContent = nf.format(s.quantity);
  $('kRet').textContent = nf.format(s.returns);
  var rate = s.quantity ? s.returns / s.quantity : 0;
  $('kRate').textContent = pct(rate, 2);
  if (p) {
    var prate = p.quantity ? p.returns / p.quantity : 0;
    setDelta('kNetD', s.net_revenue, p.net_revenue, signed, true);
    setDelta('kRecD', s.records, p.records, signed);
    setDelta('kQtyD', s.quantity, p.quantity, signed);
    setDelta('kRetD', s.returns, p.returns, signed);
    var dRate = (rate - prate) * 100;
    var e = $('kRateD'); e.className = 'delta';
    e.textContent = Math.abs(dRate) < 0.005 ? '與' + label(p.label) + '相同'
      : '較' + label(p.label) + ' ' + (dRate > 0 ? '+' : '−') + Math.abs(dRate).toFixed(2) + ' 個百分點';
  } else {
    ['kNetD', 'kRecD', 'kQtyD', 'kRetD', 'kRateD'].forEach(function (id) { $(id).textContent = ''; });
  }
}

function renderVerify() {
  var v = DATA.verification, box = $('verify');
  if (!v) { box.hidden = true; return; }
  box.hidden = false;
  $('verifySummary').textContent = '驗收數值（' + label(v.label) + '）：' + (v.ok ? '全部符合' : '有項目不符');
  var body = $('verifyBody'); body.textContent = '';
  v.checks.forEach(function (c) {
    var tr = el('tr');
    tr.appendChild(el('td', null, c.name));
    tr.appendChild(el('td', 'num', nf.format(c.expected)));
    tr.appendChild(el('td', 'num', nf.format(c.actual)));
    tr.appendChild(el('td', c.ok ? 'ok' : 'bad', c.ok ? '符合' : '不符'));
    body.appendChild(tr);
  });
}

/* ---------- 圖表 ---------- */
function setCategoryColors() {
  catColor = {};
  DATA.categories.map(function (c) { return c.category; })
    .sort(function (a, b) { return a.localeCompare(b, 'zh-Hant-TW'); })
    .forEach(function (c, i) { catColor[c] = PALETTE[i % PALETTE.length]; });
}

function make(id, cfg) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id).getContext('2d'), cfg);
}

function applyDefaults() {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  Chart.defaults.font.family = css('--sans');
  Chart.defaults.font.size = 12;
  Chart.defaults.color = css('--muted');
  Chart.defaults.borderColor = css('--line');
  Chart.defaults.animation = reduce ? false : { duration: 450 };
}

function tip() {
  return { backgroundColor: css('--ink'), titleColor: css('--sheet'), bodyColor: css('--sheet'), padding: 10, cornerRadius: 4, boxPadding: 4 };
}

function renderDaily() {
  var s = DATA.meta.snapshot, p = DATA.meta.previous, rows = DATA.daily;
  var accent = css('--accent');
  var sets = [{
    label: label(s.label), data: rows.map(function (r) { return r.net_revenue; }),
    borderColor: accent, backgroundColor: css('--accent-soft'), fill: true, tension: .25,
    borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 6, pointBackgroundColor: accent
  }];
  if (p && p.daily && p.daily.length) {
    var pm = {}; p.daily.forEach(function (r) { pm[r.sale_date] = r.net_revenue; });
    sets.unshift({
      label: label(p.label), data: rows.map(function (r) { return pm[r.sale_date] == null ? null : pm[r.sale_date]; }),
      borderColor: css('--muted'), borderDash: [6, 5], borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      fill: false, tension: .25
    });
  }
  var maxR = rows.reduce(function (a, b) { return b.net_revenue > a.net_revenue ? b : a; });
  var minR = rows.reduce(function (a, b) { return b.net_revenue < a.net_revenue ? b : a; });
  var avg = sum(rows, function (r) { return r.net_revenue; }) / rows.length;
  var txt = '日均 ' + money(avg) + '；最高是 ' + day(maxR.sale_date) + '（' + money(maxR.net_revenue) + '），最低是 ' + day(minR.sale_date) + '（' + money(minR.net_revenue) + '）。';
  if (p) txt += ' 虛線為' + label(p.label) + '。';
  $('insDaily').textContent = txt;
  $('cDaily').setAttribute('aria-label', '每日淨銷售額折線圖。' + txt);

  make('cDaily', {
    type: 'line',
    data: { labels: rows.map(function (r) { return day(r.sale_date); }), datasets: sets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: sets.length > 1, align: 'end', labels: { usePointStyle: true, boxWidth: 8 } },
        tooltip: Object.assign(tip(), { callbacks: { label: function (c) { return c.dataset.label + '：' + money(c.parsed.y); } } })

      scales: {
        x: { grid: { display: false }, ticks: { maxTicksLimit: 15, maxRotation: 0 } },
        y: { beginAtZero: true, ticks: { callback: function (v) { return wan(v); } } }
      }
    }
  });

  DATA.channel_category.forEach(function (r) { lookup[r.channel + '|' + r.category] = r.net_revenue; });
  var txt = chans.map(function (c) { return c.channel + ' ' + pct(c.net_revenue / total); }).join('、') + '。';
  $('insChannel').textContent = '各通路占比：' + txt + ' 顏色為商品分類。';
  $('cChannel').setAttribute('aria-label', '各通路淨銷售額堆疊長條圖。各通路占比：' + txt);
  make('cChannel', {
    type: 'bar',
    data: { labels: chans.map(function (c) { return c.channel; }),
      datasets: cats.map(function (cat) {
        return { label: cat, backgroundColor: catColor[cat], borderRadius: 2, maxBarThickness: 64,
          data: chans.map(function (c) { return lookup[c.channel + '|' + cat] || 0; }) };
      }) },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
        tooltip: Object.assign(tip(), { callbacks: {
          label: function (c) { return c.dataset.label + '：' + money(c.parsed.y); },
          footer: function (items) { return '合計：' + money(sum(items, function (i) { return i.parsed.y; })); } } }) },
      scales: { x: { stacked: true, grid: { display: false } },
        y: { stacked: true, beginAtZero: true, ticks: { callback: function (v) { return wan(v); } } } }
    }
  });
}

function renderScatter() {
  var cats = Object.keys(catColor);
  var recs = DATA.records;
  $('insScatter').textContent = '每個點是一筆銷售紀錄（共 ' + nf.format(recs.length) + ' 筆）。單價越高的商品，同樣數量下的位置越高。';
  $('cScatter').setAttribute('aria-label', '淨售出數量與淨銷售額散佈圖，共 ' + recs.length + ' 筆紀錄。');
  make('cScatter', {
    type: 'scatter',
    data: { datasets: cats.map(function (cat) {
      return { label: cat, backgroundColor: catColor[cat] + 'B3', borderColor: catColor[cat], pointRadius: 4, pointHoverRadius: 6,
        data: recs.filter(function (r) { return r.category === cat; }).map(function (r) {
          return { x: r.net_quantity, y: r.net_revenue, name: r.product_name, date: r.sale_date, channel: r.channel };
        }) };
    }) },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } },
        tooltip: Object.assign(tip(), { callbacks: {
          title: function (items) { var d = items[0].raw; return d.name + '　' + day(d.date) + '　' + d.channel; },
          label: function (c) { return '淨售出 ' + nf.format(c.raw.x) + ' 件，' + money(c.raw.y); } } }) },
      scales: {
        x: { beginAtZero: true, title: { display: true, text: '淨售出數量（售出 − 退貨）' } },
        y: { beginAtZero: true, title: { display: true, text: '淨銷售額' }, ticks: { callback: function (v) { return wan(v); } } }
      }
    }
  });
}

function renderCharts() {
  if (typeof Chart === 'undefined') { $('insDaily').textContent = '圖表元件載入失敗，請確認 vendor/chart.umd.js 是否存在。'; return; }
  applyDefaults();
  setCategoryColors();
  renderLegend();
  renderDaily(); renderProduct(); renderCategory(); renderChannel(); renderScatter();
}

function renderAll() { renderStatus(); renderKpis(); renderCharts(); renderVerify(); }

/* ---------- 自動檢查新資料 ---------- */
var toastTimer;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4000);
}

function poll() {
  if (location.protocol === 'file:') return;
  fetch('data.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (next) {
      pollState = 'ok'; lastCheck = new Date();
      if (next && next.meta && next.meta.generated_at !== DATA.meta.generated_at) {
        DATA = next; renderAll(); toast('已載入新版資料');
      } else { renderStatus(); }
    })
    .catch(function () { pollState = 'error'; renderStatus(); });
}

if (DATA) {
  renderAll();
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { renderCharts(); });
} else {
  $('stSnapshot').textContent = '尚未產生資料，請先執行 pipeline.py build';
}
})();
</script>
</body>
</html>
